services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ardoise
      POSTGRES_PASSWORD: ardoise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardoise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
