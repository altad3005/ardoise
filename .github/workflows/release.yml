name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [identity, management, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.image == 'web' && 'web' || 'service' }}.Dockerfile
          build-args: SERVICE=${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ardoise-${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ardoise-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
